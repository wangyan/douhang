services:
  douhang:
    image: douhang:latest
    build: .
    ports:
      - "3000:3000"
    volumes:
      # 数据库与上传素材持久化
      - ./data:/app/data
      # 离线浏览器安装包（可选）：官方镜像不含安装包，纯内网分发时挂载；
      # 先在联网环境执行 scripts/download-browsers.sh，或手动放好安装包再启动
      - ./public/browsers:/app/public/browsers
      # Docker socket：容器状态 Widget 经它读取引擎数据
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # 容器内 nextjs 用户加入 socket 组；Docker Desktop 为 root(0) 组，
      # Linux NAS 上一般是 docker 组，需覆盖：DOCKER_GID=<gid> docker compose up -d
      - "${DOCKER_GID:-0}"
    environment:
      # NextAuth 配置（生产环境务必修改 AUTH_SECRET）
      - AUTH_SECRET=${AUTH_SECRET:-please-change-this-secret-in-production-32chars}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?请在 .env 中设置 AUTH_PASSWORD}
      - AUTH_URL=${AUTH_URL:-}
      - DATABASE_URL=file:./data/sqlite.db
      # 容器时区（IANA 标识），默认东八区，可按部署地覆盖
      - TZ=${TZ:-Asia/Shanghai}
      # 可选：DOCKER_GID（手动指定 socket 组，默认自动探测）；PUID/PGID（匹配宿主机用户）
      - DOCKER_GID=${DOCKER_GID:-}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    restart: unless-stopped
