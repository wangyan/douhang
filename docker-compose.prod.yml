# 生产部署：拉取容器镜像。首次部署在同目录创建 .env（设置 AUTH_SECRET
# 与账号密码）后 docker compose -f docker-compose.prod.yml up -d 即可，
# 数据目录 ./data 自动创建，Docker 监控自动获取 socket 权限
services:
  douhang:
    # 国内网络环境可替换为国内官方镜像：hamgit.com/wangyan/douhang:latest
    # 上述渠道均不可达时，可回落到备选镜像（Docker Hub）：bg7pbp/douhang:latest
    image: ghcr.io/wangyan/douhang:latest   # 锁定版本可改为具体 tag（如 :v1.3.1）
    container_name: douhang
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # 离线浏览器安装包（可选）：官方镜像不含安装包，纯内网分发时挂载；
      # 先在联网环境执行 scripts/download-browsers.sh，或手动放好安装包再启动
      - ./public/browsers:/app/public/browsers
      # Docker socket：容器状态 Widget 经它读取引擎数据
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTH_SECRET=${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?请在 .env 中设置 AUTH_PASSWORD}
      - AUTH_URL=${AUTH_URL:-}
      # 容器时区（IANA 标识），默认东八区，可按部署地覆盖
      - TZ=${TZ:-Asia/Shanghai}
      # 可选：DOCKER_GID（手动指定 socket 组，默认自动探测）；PUID/PGID（匹配宿主机用户）
      - DOCKER_GID=${DOCKER_GID:-}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    restart: unless-stopped
