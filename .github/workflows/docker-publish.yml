name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签 (例如 v1.0.0)'
        required: false
        type: string

# 并发保护：同一个 ref 重复触发时自动取消在途旧作业，避免资源浪费与推送冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 解析发布版本标签与规范化镜像路径
  resolve:
    name: Resolve target tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TARGET_TAG="${INPUT_TAG:-}"
          if [ -z "$TARGET_TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TARGET_TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效或未指定版本标签：'$TARGET_TAG'。必须为符合规范的发布版本标签 (vX.Y.Z)！"
            exit 1
          fi
          # 容器镜像规范要求仓库路径全小写
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "正在为目标标签 [$TARGET_TAG] 构建多架构镜像 (${IMAGE_NAME})..."

  # 按架构并行执行原生构建并按摘要推送
  build:
    name: Build (${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仅推送内容摘要以隔离多架构产物，并通过 Registry mode=max 跨版本缓存多阶段构建层
      - name: Build and push by digest to GitHub Container Registry (GHCR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.resolve.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.resolve.outputs.image }}:buildcache-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::构建未产出镜像摘要 (digest 为空)！"
            exit 1
          fi
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 汇集各架构摘要，创建多架构清单并发布标签
  merge:
    name: Merge & Publish Multi-Arch Image (GHCR)
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 校验架构摘要完整性并发布多架构清单
      - name: Create manifest list and push to GitHub Container Registry (GHCR)
        run: |
          REPO="${{ needs.resolve.outputs.image }}"
          TAG="${{ needs.resolve.outputs.tag }}"
          DIGESTS_DIR="${{ runner.temp }}/digests"

          if [ ! -d "$DIGESTS_DIR" ]; then
            echo "::error::未找到镜像摘要存储目录：$DIGESTS_DIR"
            exit 1
          fi

          cd "$DIGESTS_DIR"
          shopt -s nullglob
          DIGEST_ARGS=()
          for f in *; do
            if [[ -f "$f" && "$f" =~ ^[0-9a-f]{64}$ ]]; then
              DIGEST_ARGS+=("${REPO}@sha256:${f}")
            fi
          done

          if [ ${#DIGEST_ARGS[@]} -lt 2 ]; then
            echo "::error::未收集到完整的多架构镜像摘要文件 (当前仅找到 ${#DIGEST_ARGS[@]} 个，预期至少 2 个：amd64 与 arm64)！"
            exit 1
          fi

          echo "正在合并架构清单并推送到 GHCR：${DIGEST_ARGS[*]}"
          docker buildx imagetools create \
            --tag "${REPO}:${TAG}" \
            --tag "${REPO}:latest" \
            "${DIGEST_ARGS[@]}"

      - name: Inspect image manifest
        run: |
          docker buildx imagetools inspect "${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}"
