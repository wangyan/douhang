name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签 (例如 v1.0.0)'
        required: false
        type: string

# 并发保护：同一个 ref 重复触发时自动取消在途旧作业，避免资源浪费与推送冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Multi-Arch Docker Images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 兜底超时保护，官方 GHCR 多架构构建通常在 10 分钟内完成
    steps:
      - name: Resolve target tag
        id: resolve
        run: |
          TARGET_TAG="${{ inputs.tag }}"
          if [ -z "$TARGET_TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效或未指定版本标签：'$TARGET_TAG'。必须为符合规范的发布版本标签 (vX.Y.Z)！"
            exit 1
          fi
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "正在为目标标签 [$TARGET_TAG] 构建多架构镜像..."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.resolve.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false # 保持最高兼容性，避免部分自建私有 Registry 不兼容 OCI attestation
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
